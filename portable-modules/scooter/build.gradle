plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
}
version = '1.0.0-portable-v34'
group = 'pl.aridlin.portablescooter'
base { archivesName = 'portable-scooters-neoforge-1.21.1' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
neoForge {
    version = '21.1.248'
    runs {
        client { client(); gameDirectory = file('run/client') }
        server { server(); gameDirectory = file('run/server'); programArgument '--nogui' }
        gameTestServer { type = 'gameTestServer'; gameDirectory = file('run/gametest') }
    }
    mods { goplanska_kukirin { sourceSet sourceSets.main } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
tasks.named('jar', Jar) { from('LICENSE') { rename { 'LICENSE-CODE-GPL-3.0.txt' } } }

// Permit isolated development server commands through the terminal.
tasks.named('runServer', JavaExec) { standardInput = System.in }
