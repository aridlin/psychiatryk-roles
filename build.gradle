plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = 'pl.aridlin'
version = '1.0.0'

base {
    archivesName = 'psychiatryk-roles'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.named('jar', Jar) {
    manifest {
        attributes([
            'Specification-Title': 'Psychiatryk Roles',
            'Specification-Vendor': 'aridlin',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor': 'aridlin',
            'MixinConfigs': 'psychiatryk_roles.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

// Isolated local Forge smoke server; never points at the production world.
minecraft.runs {
    server {
        workingDirectory project.file('run-smoke')
        args '--nogui'
        mods { psychiatryk_roles { source sourceSets.main } }
    }
}

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestRuntimeOnly.extendsFrom runtimeOnly
}
minecraft.runs {
    gameTestServer {
        jvmArgs '-Xms256m', '-Xmx1G', '-XX:ActiveProcessorCount=2'
        workingDirectory project.file('run-gametest')
        property 'forge.enabledGameTestNamespaces', 'psychiatryk_roles'
        args '--mixin.config=psychiatryk_roles.mixins.json'
        mods { psychiatryk_roles { source sourceSets.main; source sourceSets.gameTest } }
    }
}
